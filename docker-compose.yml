services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - '5000:5000'
    env_file:
      - ./Backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    ports:
      - '5174:80'
    depends_on:
      - backend
    restart: unless-stopped
